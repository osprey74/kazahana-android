name: Release

# タグ push で署名済み AAB をビルドし、Google Play の内部テストトラックへ
# アップロードする。製品版への昇格は Play Console で手動判断する。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Secrets が 1 つでも欠けると、後段で分かりにくいエラーになるため先に止める。
      - name: Verify required secrets
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PUSH_API_SECRET: ${{ secrets.PUSH_API_SECRET }}
        run: |
          missing=""
          for name in ANDROID_PUBLISHER_CREDENTIALS KEYSTORE_BASE64 KEYSTORE_PASSWORD \
                      KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON PUSH_API_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::未登録の Secrets:$missing — docs/release-automation.md を参照してください"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 以下 3 ファイルはいずれも .gitignore 済みのため、Secrets から復元する。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Write signing.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=../keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing.properties

      - name: Write secrets.properties
        env:
          PUSH_API_SECRET: ${{ secrets.PUSH_API_SECRET }}
        run: echo "PUSH_API_SECRET=$PUSH_API_SECRET" > secrets.properties

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Run unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      # publishReleaseBundle は bundleRelease に依存するため、AAB のビルドと
      # アップロードがこの 1 タスクで完結する。
      - name: Build and publish to Play (internal track)
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: ./gradlew :app:publishReleaseBundle --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Clean up credentials
        if: always()
        run: rm -f keystore/release.jks signing.properties secrets.properties app/google-services.json
